  <path d="M634 278H770L842 220H1018L1080 168H1320" fill="none" stroke="#45e8dd" stroke-opacity=".48" stroke-width="15" filter="url(#soft)"/>
  <g fill="#101a30" stroke="#5df1e5" stroke-width="3">
