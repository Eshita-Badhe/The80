    </filter>
  </defs>
  <rect width="1440" height="380" rx="22" fill="url(#bg)"/>
  <rect width="1440" height="380" rx="22" fill="url(#glow)"/>
  <rect width="1440" height="380" rx="22" fill="url(#grid)"/>
  <g fill="none" stroke="#8da1d1" stroke-opacity=".18" stroke-width="1">
