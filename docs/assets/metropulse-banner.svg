<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="380" viewBox="0 0 1440 380" role="img" aria-labelledby="title desc">
  <title id="title">MetroPulse by The80</title>
  <desc id="desc">Every Signal Tells a Story. A navy and violet metro infrastructure scene with cyan signal paths and station nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080c1c"/>
      <stop offset=".56" stop-color="#17142e"/>
      <stop offset="1" stop-color="#101b31"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="45%" r="55%">
      <stop offset="0" stop-color="#6743b6" stop-opacity=".33"/>
      <stop offset="1" stop-color="#6743b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#45e8dd" stop-opacity=".12"/>
      <stop offset=".52" stop-color="#45e8dd"/>
      <stop offset="1" stop-color="#a28aff"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#a3b4e2" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
